<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LASSİ</title>
  <style>
    body { margin: 0; background: #14152A; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 20px; }
    .box { text-align: center; color: #EDEEF7; max-width: 360px; }
    .logo { color: #FDCF34; font-size: 30px; font-weight: 800; letter-spacing: 1px; }
    h2 { margin: 18px 0 0; font-size: 18px; }
    p { color: #9A9EC4; margin-top: 12px; font-size: 14px; line-height: 20px; }
    a.btn { display: none; margin-top: 24px; background: #FDCF34; color: #14152A; padding: 14px 28px; border-radius: 14px; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">LASSİ</div>
    <h2 id="msg">Ouverture de la boutique…</h2>
    <p id="sub">Redirection en cours…</p>
    <a id="store" class="btn">Télécharger LASSİ</a>
  </div>
  <script>
    (function () {
      var path = window.location.pathname || '';
      var SUPABASE_URL = 'https://tsdemraszwtbzgtyjzum.supabase.co';

      // Route lien de partage prestataire : /p/{slug}
      var m = path.match(/^\/p\/([^\/?#]+)/);
      if (!m) {
        // Tout autre 404 → accueil
        window.location.replace('/');
        return;
      }

      var slug = decodeURIComponent(m[1]);

      // Log du clic (best-effort, ne bloque pas la redirection)
      try {
        var src = new URLSearchParams(window.location.search).get('src') || 'direct';
        fetch(SUPABASE_URL + '/functions/v1/log-clic-partage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug: slug, source: src }),
          keepalive: true,
        }).catch(function () {});
      } catch (e) {}

      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/.test(ua);

      var iosStore = 'https://apps.apple.com/app/id6802453488';
      var androidStore = 'https://play.google.com/store/apps/details?id=com.lassiapp.lassiapp';
      var storeUrl = isIOS ? iosStore : androidStore;

      // Bouton store visible tout de suite (secours si l'auto-redirection est bloquée)
      if (isIOS || isAndroid) {
        var btn = document.getElementById('store');
        btn.href = storeUrl;
        btn.style.display = 'inline-block';
      }

      if (isAndroid) {
        // intent:// : ouvre l'app si installée, sinon bascule sur le Play Store.
        // Ne provoque JAMAIS de page blanche (contrairement au schéma custom nu).
        window.location.replace(
          'intent://p/' + encodeURIComponent(slug) +
          '#Intent;scheme=lassiapp;package=com.lassiapp.lassiapp;' +
          'S.browser_fallback_url=' + encodeURIComponent(androidStore) + ';end'
        );
        return;
      }

      if (isIOS) {
        // L'Universal Link (AASA /p/*) ouvre déjà l'app si elle est installée.
        // Si on arrive ici, l'app est absente → App Store directement.
        // (On n'ouvre PAS lassiapp:// : sur iOS ça vide la page → écran blanc.)
        window.location.replace(iosStore);
        return;
      }

      // Desktop / autre → invite à ouvrir sur mobile
      document.getElementById('msg').textContent = 'Ouvrez ce lien sur votre téléphone';
      document.getElementById('sub').textContent =
        "Ouvrez le lien sur mobile pour découvrir la boutique dans l'app LASSİ.";
    })();
  </script>
</body>
</html>
