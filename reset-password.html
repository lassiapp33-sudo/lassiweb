<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Réinitialisation — LASSI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #14152A;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 360px;
      width: 100%;
    }
    .icon {
      width: 66px;
      height: 66px;
      background: rgba(253,207,52,0.12);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    p {
      color: #8f96b3;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: block;
      background: #FDCF34;
      color: #14152A;
      font-weight: 700;
      font-size: 15px;
      padding: 16px;
      border-radius: 14px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .btn:active { opacity: 0.85; }
    .error { color: #ff6b6b; font-size: 14px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FDCF34" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        <path d="M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"/>
        <circle cx="12" cy="15" r="1" fill="#FDCF34" stroke="none"/>
      </svg>
    </div>
    <h1>Nouveau mot de passe</h1>
    <p id="msg">Ouverture de l'app LASSI…</p>
    <button class="btn" id="btn" onclick="openApp()">Ouvrir LASSI</button>
    <p class="error" id="err" style="display:none">
      Si l'app ne s'ouvre pas, assure-toi que LASSI est installé sur ton téléphone.
    </p>
  </div>

  <script>
    function buildDeepLink() {
      var search = window.location.search;   // ?code=... (PKCE)
      var hash   = window.location.hash;     // #access_token=... (implicit)
      if (search) return 'lassiapp://reset-password' + search;
      if (hash)   return 'lassiapp://reset-password' + hash;
      return null;
    }

    function openApp() {
      var link = buildDeepLink();
      if (!link) {
        document.getElementById('err').style.display = 'block';
        document.getElementById('msg').textContent = 'Lien invalide ou expiré.';
        return;
      }
      window.location.href = link;
      setTimeout(function() {
        document.getElementById('err').style.display = 'block';
      }, 2000);
    }

    // Tentative automatique au chargement
    window.onload = function() {
      var link = buildDeepLink();
      if (link) {
        document.getElementById('msg').textContent = 'Ouverture de l\'app LASSI…';
        window.location.href = link;
        setTimeout(function() {
          document.getElementById('err').style.display = 'block';
          document.getElementById('msg').textContent = 'Si l\'app ne s\'ouvre pas, appuie sur le bouton.';
        }, 2000);
      } else {
        document.getElementById('msg').textContent = 'Lien invalide ou expiré.';
        document.getElementById('err').style.display = 'block';
      }
    };
  </script>
</body>
</html>
